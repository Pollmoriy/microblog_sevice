services:
  db:
    image: postgres:16
    container_name: microblog_db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: microblog

    ports:
      - "5432:5432"

    volumes:
      - microblog_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: microblog_backend

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@db:5432/microblog

    volumes:
      - ./backend:/app

    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: microblog_frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

volumes:
  microblog_pg_data: