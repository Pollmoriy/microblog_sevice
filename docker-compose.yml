services:
  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: test_microblog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d test_microblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  db:
    image: postgres:16
    container_name: microblog_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - microblog_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microblog"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: backend
    container_name: microblog_backend

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    volumes:
      - ./backend:/app/backend

    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: microblog_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  microblog_pg_data: