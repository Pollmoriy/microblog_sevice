version: "3.9"

services:
  db:
    image: postgres:16
    container_name: microblog_db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: microblog

    ports:
      - "5432:5432"

    volumes:
      - microblog_pg_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d microblog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  app:
    build: .

    container_name: microblog_app

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@db:5432/microblog

    volumes:
      - .:/app

    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

    restart: unless-stopped


volumes:
  microblog_pg_data: