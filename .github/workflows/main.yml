name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: test_microblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d test_microblog"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set environment variables
        run: echo "ENV ready"

      - name: Lint (flake8)
        run: flake8 backend

      - name: Type check (mypy)
        env:
          DATABASE_URL: postgresql+asyncpg://admin:admin@localhost:5432/test_microblog
        run: |
          cd backend
          mypy .

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://admin:admin@localhost:5432/test_microblog
          TEST_DATABASE_URL: postgresql+asyncpg://admin:admin@localhost:5432/test_microblog
        run: pytest backend/tests -v
